<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
  border-bottom ::after  solid #AED6F1
  /* Selector Class — elemen yang punya class='highlight' */ 
  .highlight 
  { background-color: yellow; 
    font-weight: bold;
  } 
  /* Selector ID — elemen dengan id='hero' */
  #hero 
  { background-color:
     #1A5276;
      color: rgb(10, 10, 10); 
      padding: 40px; 
  } 
  /* Grouping — terapkan gaya yang sama ke h1, h2, h3 */ 
  h1, h2, h3 
  { font-family: 'Georgia', serif;
   color: #3b65da; 
  } 
  /* Pseudo-class — tautan saat di-hover */
   a:hover 
   { color: rgb(238, 0, 0);
   text-decoration: underline;
   }
    </style>
</head>
<body>
   <!DOCTYPE html>
<html>
<head>
    <title>PRADIPTA RADITYA</title>

    <style>
        body {
            background-color: #0f172a;
            font-family: 'Segoe UI', sans-serif;
        }

        table {
            width: 500px;
            margin: 100px auto;
            border-collapse: collapse;
            box-shadow: 0 0 30px #38bdf8;
        }

        th {
            background-color: #38bdf8;
            color: #0f172a;
            padding: 20px;
            font-size: 25px;
        }

        td {
            background-color: #1e293b;
            color: white;
            padding: 25px;
            text-align: center;
            font-size: 22px;
            transition: 0.3s;
        }

        td:hover {
            background-color: #334155;
            color: #38bdf8;
            transform: scale(1.02);
        }
    </style>
</head>

<body>

<table>
    <tr>
        <th>SELAMAT DATANG</th>
    </tr>
    <tr>
        <td>PRADIPTA RADITYA</td>
    </tr>
</table>

</body>
</html>
</body>
</html>
